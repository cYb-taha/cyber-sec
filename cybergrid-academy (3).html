<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberGrid Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --bg-0:#03050c; --bg-1:#060a16; --bg-2:#0a1024; --panel:#0b1226; --panel-2:#0e1730;
  --line: rgba(88,220,255,.14); --line-strong: rgba(88,220,255,.32);
  --cyan:#39e6ff; --cyan-dim:#1c9fc4; --mag:#ff4dd8; --grn:#4dffb0; --ylw:#ffcf4d; --red:#ff5f6d; --amber:#ff9d4d;
  --ink:#e6f6ff; --ink-dim:#8fa3c4; --ink-faint:#4c5a7a;
  --font-display:'Orbitron','Segoe UI',Arial,sans-serif;
  --font-mono:'JetBrains Mono','Share Tech Mono','Courier New',monospace;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:18px;--sp-5:26px;--sp-6:38px;--sp-7:56px;
  --shadow-panel: 0 20px 60px -25px rgba(0,0,0,.7);
  --shadow-glow-cyan: 0 0 0 1px rgba(57,230,255,.12), 0 0 24px -4px rgba(57,230,255,.35);
  --shadow-glow-mag: 0 0 0 1px rgba(255,77,216,.12), 0 0 24px -4px rgba(255,77,216,.35);
  --ease: cubic-bezier(.22,.9,.3,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg-0:#eef3fb; --bg-1:#e7eefb; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f2f6fd;
    --line: rgba(0,110,190,.16); --line-strong: rgba(0,110,190,.32);
    --cyan:#0086b3; --cyan-dim:#0086b3; --mag:#b8009a; --grn:#0a9463; --ylw:#9a7300; --red:#c92a3c; --amber:#b5650a;
    --ink:#0c1830; --ink-dim:#495a7a; --ink-faint:#7c8bac;
    --shadow-panel: 0 20px 50px -30px rgba(20,40,80,.25);
  }
}
:root[data-theme="dark"]{
  --bg-0:#03050c; --bg-1:#060a16; --bg-2:#0a1024; --panel:#0b1226; --panel-2:#0e1730;
  --line: rgba(88,220,255,.14); --line-strong: rgba(88,220,255,.32);
  --cyan:#39e6ff; --cyan-dim:#1c9fc4; --mag:#ff4dd8; --grn:#4dffb0; --ylw:#ffcf4d; --red:#ff5f6d; --amber:#ff9d4d;
  --ink:#e6f6ff; --ink-dim:#8fa3c4; --ink-faint:#4c5a7a;
}
*{box-sizing:border-box;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important;} }
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg-0); color:var(--ink); font-family:var(--font-mono);
  min-height:100%; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  background-image: radial-gradient(ellipse 900px 500px at 50% -8%, rgba(57,230,255,.10), transparent 65%),
                     radial-gradient(ellipse 700px 500px at 100% 10%, rgba(255,77,216,.06), transparent 60%);
  background-attachment: fixed;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg-1);}
::-webkit-scrollbar-thumb{background:var(--cyan-dim);border-radius:6px;}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px; border-radius:4px;}
h1,h2,h3,h4,.head{font-family:var(--font-display);letter-spacing:.02em;margin:0;font-weight:700;}
a{color:var(--cyan);}
button{font-family:var(--font-mono);cursor:pointer;}
#bgcanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;}
#app{max-width:1180px;margin:0 auto;padding:22px 18px 70px;position:relative;z-index:1;}
.fade-in{animation:fadeIn .45s var(--ease);}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 2px 28px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand .logo{width:38px;height:38px;border:1.5px solid var(--cyan);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--cyan);box-shadow:var(--shadow-glow-cyan);font-size:18px;background:rgba(57,230,255,.05);}
.brand .name{font-family:var(--font-display);font-weight:800;font-size:1.12rem;color:var(--ink);letter-spacing:.03em;}
.brand .name b{color:var(--cyan);font-weight:800;}
.navbtns{display:flex;gap:6px;flex-wrap:wrap;}
.navbtns button{background:transparent;border:1px solid transparent;color:var(--ink-dim);padding:8px 14px;border-radius:8px;font-size:.76rem;letter-spacing:.04em;transition:.15s var(--ease);font-weight:500;}
.navbtns button:hover{color:var(--ink);background:rgba(255,255,255,.04);}
.navbtns button.active{color:var(--cyan);background:rgba(57,230,255,.08);border-color:var(--line-strong);}
.userchip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:22px;padding:6px 14px 6px 8px;font-size:.78rem;color:var(--ink-dim);background:var(--panel);}
.userchip .dot{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 6px var(--grn);}
.userchip b{color:var(--cyan);font-family:var(--font-display);}

/* ---- panels & cards ---- */
.panel{background:linear-gradient(175deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px;position:relative;box-shadow:var(--shadow-panel);}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:820px){.grid2{grid-template-columns:1fr;}.grid3{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.grid3{grid-template-columns:1fr;}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--cyan);border:1px solid var(--cyan);color:#00121a;padding:12px 22px;border-radius:9px;font-family:var(--font-display);font-size:.78rem;letter-spacing:.04em;font-weight:700;transition:.18s var(--ease);position:relative;}
.btn:hover{box-shadow:0 6px 24px -6px rgba(57,230,255,.55);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.outline{background:transparent;color:var(--cyan);}
.btn.mag{background:var(--mag);border-color:var(--mag);color:#22001a;}
.btn.mag:hover{box-shadow:0 6px 24px -6px rgba(255,77,216,.55);}
.btn.mag.outline{background:transparent;color:var(--mag);}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#00220f;}
.btn.grn.outline{background:transparent;color:var(--grn);}
.btn.ylw{background:var(--ylw);border-color:var(--ylw);color:#241800;}
.btn.ylw.outline{background:transparent;color:var(--ylw);}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-dim);}
.btn.ghost:hover{border-color:var(--line-strong);color:var(--ink);box-shadow:none;transform:none;}
.btn:disabled{opacity:.32;cursor:not-allowed;box-shadow:none !important;transform:none !important;}
.btn.block{width:100%;}

input[type=text]{background:var(--bg-1);border:1px solid var(--line);color:var(--ink);font-family:var(--font-mono);padding:14px 16px;border-radius:9px;font-size:1rem;width:100%;outline:none;transition:.15s;}
input[type=text]:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(57,230,255,.12);}
input[type=text]::placeholder{color:var(--ink-faint);}

.progress-track{height:7px;border-radius:5px;background:var(--bg-1);overflow:hidden;border:1px solid var(--line);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag));border-radius:5px;transition:width .8s var(--ease);}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--ink-dim);font-weight:500;}
.badge.on{border-color:var(--grn);color:var(--grn);background:rgba(77,255,176,.08);}
.badge.gold{border-color:var(--ylw);color:var(--ylw);background:rgba(255,207,77,.08);}

.roomnode{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-md);padding:16px;cursor:pointer;transition:.18s var(--ease);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;}
.roomnode:hover{border-color:var(--line-strong);box-shadow:var(--shadow-glow-cyan);transform:translateY(-2px);}
.roomnode.done{border-color:rgba(77,255,176,.4);}
.roomnode.done::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grn);}
.roomnum{font-family:var(--font-display);color:var(--ink-faint);font-size:.68rem;letter-spacing:.06em;}
.roomstatus{font-size:.66rem;letter-spacing:.05em;color:var(--grn);font-weight:600;}

.catcard{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-md);padding:20px;cursor:pointer;transition:.18s var(--ease);}
.catcard:hover{border-color:rgba(255,77,216,.4);box-shadow:var(--shadow-glow-mag);transform:translateY(-2px);}
.catcard .icon{font-size:1.7rem;line-height:1;}

.qcard{border:1px solid var(--line);background:var(--bg-1);border-radius:var(--radius-md);padding:18px;margin-top:16px;}
.qopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:13px 15px;border-radius:9px;margin:8px 0;transition:.14s var(--ease);font-family:var(--font-mono);font-size:.9rem;}
.qopt .oletter{width:24px;height:24px;flex:none;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-family:var(--font-display);color:var(--ink-dim);}
.qopt:hover{border-color:var(--line-strong);}
.qopt.sel{border-color:var(--mag);box-shadow:0 0 0 1px var(--mag);}
.qopt.sel .oletter{border-color:var(--mag);color:var(--mag);}
.qopt.correct{border-color:var(--grn);background:rgba(77,255,176,.07);}
.qopt.correct .oletter{background:var(--grn);border-color:var(--grn);color:#00220f;}
.qopt.wrong{border-color:var(--red);background:rgba(255,95,109,.07);}
.qopt.wrong .oletter{background:var(--red);border-color:var(--red);color:#2a0006;}
.qmeta{font-size:.68rem;color:var(--ink-faint);letter-spacing:.05em;margin-bottom:2px;}

.terminal{background:#00060d;border:1px solid var(--line);border-radius:var(--radius-md);padding:18px 20px;font-size:.87rem;line-height:1.85;font-family:var(--font-mono);}
.terminal .ln{color:var(--ink);}
.terminal .ln::before{content:'❯ ';color:var(--grn);}

.diploma{border:1px solid var(--line-strong);border-radius:var(--radius-lg);padding:44px 34px;text-align:center;background:
  radial-gradient(ellipse 500px 260px at 50% -10%, rgba(255,207,77,.10), transparent 70%), var(--panel);position:relative;}
.diploma::before,.diploma::after{content:'';position:absolute;width:34px;height:34px;border:2px solid var(--ylw);opacity:.55;}
.diploma::before{top:14px;left:14px;border-right:none;border-bottom:none;}
.diploma::after{bottom:14px;right:14px;border-left:none;border-top:none;}
.diploma h2{color:var(--ylw);font-size:1.6rem;}

.statring{position:relative;width:76px;height:76px;flex:none;}
.statring svg{transform:rotate(-90deg);}
.statring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:.95rem;}

.footer-note{color:var(--ink-faint);font-size:.72rem;text-align:center;margin-top:40px;letter-spacing:.02em;}

.lbrow{display:flex;align-items:center;gap:14px;padding:13px 14px;border-bottom:1px solid var(--line);transition:.15s;}
.lbrow:last-child{border-bottom:none;}
.lbrow.me{background:rgba(57,230,255,.05);border-radius:9px;}
.lbrank{font-family:var(--font-display);width:34px;text-align:center;color:var(--ink-dim);font-weight:700;}

.small{font-size:.79rem;color:var(--ink-dim);}
.faint{color:var(--ink-faint);}
.center{text-align:center;}
.mt{margin-top:16px;} .mt2{margin-top:28px;}
.tag{font-size:.7rem;color:var(--mag);border:1px solid var(--mag);padding:3px 10px;border-radius:20px;font-weight:600;letter-spacing:.03em;}

/* toast */
#toastWrap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:12px 18px;font-size:.82rem;box-shadow:var(--shadow-panel);animation:toastIn .3s var(--ease);color:var(--ink);}
.toast b{color:var(--grn);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
.toast.out{animation:toastOut .3s var(--ease) forwards;}
@keyframes toastOut{to{opacity:0;transform:translateX(20px);}}

/* confetti canvas */
#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:60;}

/* boot sequence */
.boot{font-family:var(--font-mono);font-size:.86rem;color:var(--grn);text-align:left;min-height:120px;white-space:pre-wrap;}
.caret{display:inline-block;width:8px;height:1em;background:var(--grn);vertical-align:text-bottom;animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

/* lab terminal (VM console) */
.labwrap{border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:#00060d;margin-top:16px;box-shadow:inset 0 0 40px rgba(57,230,255,.03);}
.labhead{display:flex;align-items:center;gap:7px;padding:9px 14px;background:#000308;border-bottom:1px solid var(--line);}
.labdot{width:10px;height:10px;border-radius:50%;flex:none;}
.labdot.r{background:#ff5f6d;} .labdot.y{background:#ffcf4d;} .labdot.g{background:#4dffb0;}
.labtitle{margin-left:8px;font-size:.7rem;color:var(--ink-faint);letter-spacing:.03em;}
.labscreen{max-height:260px;overflow-y:auto;padding:14px 16px;font-size:.83rem;line-height:1.65;}
.labline{white-space:pre-wrap;word-break:break-word;margin:1px 0;}
.labline.sys{color:var(--ink-faint);}
.labline.cmd{color:var(--cyan);}
.labline.out{color:var(--ink-dim);}
.labline.err{color:var(--red);}
.labinput-row{display:flex;align-items:center;gap:9px;padding:11px 14px;border-top:1px solid var(--line);background:#000308;}
.labprompt{color:var(--grn);font-size:.82rem;white-space:nowrap;font-weight:600;}
.labinput{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--font-mono);font-size:.86rem;outline:none;min-width:0;}
.labchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);font-size:.71rem;padding:6px 12px;border-radius:20px;transition:.15s var(--ease);}
.chip:hover{border-color:var(--cyan);color:var(--cyan);}
.lablabel{display:flex;align-items:center;gap:8px;color:var(--ink-dim);font-size:.85rem;letter-spacing:.02em;margin-top:22px;font-family:var(--font-display);font-weight:600;}

/* ===================== CERTIFICATE (formal document, distinct from app chrome) ===================== */
.cert-stage{padding:10px 0 40px;}
.certsheet{
  --paper:#f6f1e6; --ink2:#1c2c4c; --ink3:#48557a; --rule: rgba(28,44,76,.35); --gold:#a9862f;
  position:relative; max-width:760px; margin:0 auto; background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.012) 0px, transparent 1px, transparent 2px),
    radial-gradient(ellipse 700px 400px at 50% 0%, rgba(28,44,76,.05), transparent 70%),
    var(--paper);
  color:var(--ink2); border:1px solid rgba(28,44,76,.25); border-radius:3px;
  padding:52px 50px 44px; box-shadow:0 30px 70px -30px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.02);
  font-family:'EB Garamond',Georgia,serif;
}
.certsheet::before{content:'';position:absolute;inset:14px;border:1.5px solid var(--rule);pointer-events:none;}
.certsheet::after{content:'';position:absolute;inset:19px;border:1px solid var(--rule);pointer-events:none;}
.cert-inner{position:relative;text-align:center;}
.cert-seal{margin:0 auto 6px;display:block;}
.cert-kicker{font-family:'EB Garamond',serif;font-style:italic;color:var(--ink3);font-size:.82rem;letter-spacing:.14em;margin-top:14px;}
.cert-title{font-family:'Playfair Display',Georgia,serif;font-weight:800;color:var(--ink2);font-size:clamp(1.35rem,3.4vw,1.9rem);letter-spacing:.02em;margin-top:8px;line-height:1.25;}
.cert-rule{width:120px;height:2px;background:var(--gold);margin:16px auto;opacity:.75;}
.cert-body{font-family:'EB Garamond',Georgia,serif;font-size:1.02rem;line-height:1.75;color:var(--ink2);max-width:560px;margin:0 auto;}
.cert-body b{font-weight:600;}
.cert-award-label{font-family:'Playfair Display',serif;font-size:.82rem;letter-spacing:.22em;color:var(--ink3);margin-top:34px;}
.cert-name{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:clamp(1.6rem,5vw,2.5rem);color:var(--ink2);margin-top:8px;}
.cert-role{font-family:'EB Garamond',serif;font-size:.98rem;letter-spacing:.05em;color:var(--ink3);margin-top:6px;font-variant:small-caps;}
.cert-sigrow{display:flex;justify-content:center;gap:56px;margin-top:44px;flex-wrap:wrap;}
.cert-sig{text-align:center;}
.cert-sig .sigline{font-family:'Great Vibes',cursive;font-size:1.7rem;color:var(--ink2);line-height:1;}
.cert-sig .capline{border-top:1px solid var(--rule);margin-top:6px;padding-top:6px;font-size:.72rem;letter-spacing:.1em;color:var(--ink3);font-family:'EB Garamond',serif;}
.cert-foot{margin-top:30px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.04em;color:var(--ink3);opacity:.75;}
.cert-actions{max-width:760px;margin:22px auto 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
@media(max-width:640px){.certsheet{padding:38px 22px 32px;} .cert-sigrow{gap:32px;}}
@media print{
  #bgcanvas,#confettiCanvas,#toastWrap{display:none !important;}
  .topbar,.btn,.footer-note,.cert-actions{display:none !important;}
  body{background:#fff !important;}
  #app{padding:0;max-width:100%;}
  .certsheet{box-shadow:none;border-color:#333;}
}
</style>
</head>
<body>
<canvas id="bgcanvas"></canvas>
<canvas id="confettiCanvas"></canvas>
<div id="toastWrap"></div>
<div id="app"></div>

<script>
const CATEGORIES = [
{id:'netfun',name:'Network Fundamentals',icon:'🌐',rooms:[
{t:'OSI Model Layers',c:['7 layers: Physical, Data Link, Network, Transport, Session, Presentation, Application','Each layer encapsulates data from the layer above it','Troubleshooting often starts at Layer 1 and moves up'],q:[
{t:'Which OSI layer handles logical addressing and routing?',o:['Data Link','Network','Transport','Session'],a:1},
{t:'At which layer do switches primarily operate?',o:['Physical','Data Link','Network','Application'],a:1},
{t:'TCP operates at which OSI layer?',o:['Network','Transport','Session','Presentation'],a:1}]},
{t:'TCP/IP Suite',c:['TCP is connection-oriented and guarantees delivery via handshakes and acknowledgments','UDP is connectionless, faster, but offers no delivery guarantee',"The TCP/IP model condenses OSI's 7 layers into 4"],q:[
{t:'Which protocol establishes a 3-way handshake?',o:['UDP','ICMP','TCP','ARP'],a:2},
{t:'Which is true about UDP?',o:['Guarantees order','Connectionless and fast','Uses handshakes','Always encrypted'],a:1},
{t:'How many layers does the TCP/IP model have?',o:['3','4','5','7'],a:1}]},
{t:'Subnetting & CIDR',c:['CIDR notation like /24 indicates the number of network bits','A /24 network has 256 addresses, 254 usable for hosts','Subnetting divides a network into smaller, manageable segments'],q:[
{t:'How many usable hosts in a /24 subnet?',o:['256','254','128','512'],a:1},
{t:'What does /26 indicate?',o:['26 host bits','26 network bits','26 subnets','26 broadcast addresses'],a:1},
{t:'Subnetting primarily helps with?',o:['Encryption','Efficient address allocation','Password policy','DNS caching'],a:1}]},
{t:'DNS Fundamentals',c:['DNS translates domain names into IP addresses','Record types include A, AAAA, MX, CNAME, and TXT','DNS operates primarily over UDP port 53'],q:[
{t:'Which record maps a domain to an IPv4 address?',o:['MX','A','CNAME','TXT'],a:1},
{t:'What port does DNS commonly use?',o:['80','443','53','25'],a:2},
{t:'An MX record specifies?',o:['Mail servers','Web servers','Name servers','Text data'],a:0}]},
{t:'DHCP & ARP',c:['DHCP automatically assigns IP addresses via Discover, Offer, Request, Ack','ARP resolves IP addresses to MAC addresses on a local network','ARP spoofing can enable man-in-the-middle attacks'],q:[

/* ============ BACKGROUND CIRCUIT CANVAS ============ */
(function(){
  const cv=document.getElementById('bgcanvas');
  const ctx=cv.getContext('2d');
  let w,h,nodes=[];
  function resize(){w=cv.width=window.innerWidth;h=cv.height=window.innerHeight;}
  resize(); window.addEventListener('resize',resize);
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N = reduceMotion ? 0 : Math.min(46, Math.floor((window.innerWidth*window.innerHeight)/34000));
  for(let i=0;i<N;i++){
    nodes.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18});
  }
  function isLight(){ return getComputedStyle(document.documentElement).getPropertyValue('--bg-0').trim() === '#eef3fb'; }
  function tick(){
    ctx.clearRect(0,0,w,h);
    const light = isLight();
    const lineCol = light ? 'rgba(0,110,190,ALPHA)' : 'rgba(57,230,255,ALPHA)';
    const dotCol = light ? 'rgba(0,110,190,.55)' : 'rgba(57,230,255,.55)';
    nodes.forEach(n=>{
      n.x+=n.vx; n.y+=n.vy;
      if(n.x<0||n.x>w)n.vx*=-1;
      if(n.y<0||n.y>h)n.vy*=-1;
    });
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i],b=nodes[j];
        const dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<130){
          ctx.strokeStyle = lineCol.replace('ALPHA', (1-d/130)*0.16);
          ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        }
      }
    }
    nodes.forEach(n=>{ ctx.fillStyle=dotCol; ctx.beginPath(); ctx.arc(n.x,n.y,1.6,0,7); ctx.fill(); });
    requestAnimationFrame(tick);
  }
  if(N>0) tick();
})();

/* ============ CONFETTI ============ */
function confettiBurst(){
  const cv=document.getElementById('confettiCanvas');
  const ctx=cv.getContext('2d');
  cv.width=window.innerWidth; cv.height=window.innerHeight;
  const colors=['#39e6ff','#ff4dd8','#4dffb0','#ffcf4d'];
  let parts=[];
  for(let i=0;i<90;i++){
    parts.push({x:cv.width/2,y:cv.height*0.25,vx:(Math.random()-.5)*11,vy:Math.random()*-7-3,g:.28,r:Math.random()*5+3,c:colors[i%colors.length],rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:100});
  }
  function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive=false;
    parts.forEach(p=>{
      if(p.life<=0)return;
      alive=true;
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r); ctx.restore();
    });
    if(alive) requestAnimationFrame(frame); else ctx.clearRect(0,0,cv.width,cv.height);
  }
  frame();
}

let TERM_SCROLL = {};
function ensureScroll(key){ if(!TERM_SCROLL[key]) TERM_SCROLL[key]=[{type:'sys',text:'CyberGrid Lab Console — type \'help\' to see available commands for this room.'}]; return TERM_SCROLL[key]; }
function helpText(catId){ const lib=TERMINAL_LIB[catId]||[]; return 'Available commands:\n  '+lib.map(e=>e.trig).concat(['help','clear']).join(', '); }
function findResponse(catId, cmdRaw){
  const cmd = cmdRaw.trim();
  const low = cmd.toLowerCase();
  if(low==='clear') return {clear:true};
  if(low==='help') return {text:helpText(catId), recognized:false, isHelp:true};
  const lib = (TERMINAL_LIB[catId]||[]).slice().sort((a,b)=>b.trig.length-a.trig.length);
  for(const entry of lib){
    if(low===entry.trig || low.indexOf(entry.trig+' ')===0){
      return {text: typeof entry.out==='function' ? entry.out(cmd) : entry.out, recognized:true};
    }
  }
  return {text:'command not found: '+cmd.split(' ')[0]+"  (type 'help' for available commands)", recognized:false};
}
function renderTerminal(catId, idx){
  const key=roomKey(catId, idx);
  const scroll=ensureScroll(key);
  const lib=TERMINAL_LIB[catId]||[];
  let s='<div class="labwrap"><div class="labhead"><span class="labdot r"></span><span class="labdot y"></span><span class="labdot g"></span><span class="labtitle">agent@cybergrid-lab · '+catId+'-sim</span></div>';
  s+='<div class="labscreen" id="labscreen_'+key+'">';
  scroll.forEach(line=>{
    const cls = line.type==='cmd'?'cmd':(line.type==='err'?'err':(line.type==='sys'?'sys':'out'));
    const prefix = line.type==='cmd' ? 'agent@cybergrid:~$ ' : '';
    s+='<div class="labline '+cls+'">'+esc(prefix+line.text)+'</div>';
  });
  s+='</div>';
  s+='<div class="labinput-row"><span class="labprompt">$</span><input type="text" class="labinput" id="labinput_'+key+'" placeholder="type a command… try: '+esc(lib[0]?lib[0].trig:'help')+'" autocomplete="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')runLabCommand(\''+catId+'\','+idx+')"></div>';
  s+='</div>';
  s+='<div class="labchips">';
  lib.slice(0,6).forEach(e=>{
    s+='<button class="chip" onclick="fillLabInput(\''+key+'\',\''+e.trig.replace(/'/g,"")+' \')">'+esc(e.trig)+'</button>';
  });
  s+='<button class="chip" onclick="fillLabInput(\''+key+'\',\'help\')">help</button>';
  s+='</div>';
  s+='<div class="small mt" style="color:'+(ST.labDone[key]?'var(--grn)':'var(--amber)')+';">'+(ST.labDone[key]?'✔ Lab practiced — quiz unlocked below':'Run at least one recognized command to unlock the knowledge check below.')+'</div>';
  return s;
}
function fillLabInput(key, text){ const el=document.getElementById('labinput_'+key); if(el){ el.value=text; el.focus(); } }
function runLabCommand(catId, idx){
  const key=roomKey(catId, idx);
  const inp=document.getElementById('labinput_'+key);
  if(!inp) return;
  const val=inp.value;
  if(!val.trim()) return;
  const scroll=ensureScroll(key);
  scroll.push({type:'cmd', text:val});
  const res=findResponse(catId, val);
  if(res.clear){
    TERM_SCROLL[key]=[{type:'sys',text:'Console cleared.'}];
  } else {
    scroll.push({type: res.recognized ? 'out' : (res.isHelp?'sys':'err'), text: res.text});
    if(res.recognized && !ST.labDone[key]){
      ST.labDone[key]=true; saveState();
      toast('🖥 <b>Lab practiced</b> — quiz unlocked');
    }
  }
  inp.value='';
  updateRoomDynamic(catId, idx);
}
function updateRoomDynamic(catId, idx){
  const key=roomKey(catId, idx);
  const labEl=document.getElementById('labArea'); if(labEl) labEl.innerHTML=renderTerminal(catId, idx);
  const footEl=document.getElementById('roomFooter'); if(footEl) footEl.innerHTML=roomFooterHtml(catId, idx);
  const sc=document.getElementById('labscreen_'+key); if(sc) sc.scrollTop=sc.scrollHeight;
  const inp=document.getElementById('labinput_'+key); if(inp) inp.focus();
}
function roomFooterHtml(catId, idx){
  const key=roomKey(catId, idx);

}

let ST = loadState();

function saveState(){try{localStorage.setItem(SK,JSON.stringify(ST));}catch(e){} syncLeaderboard();}

function totalRooms(){return CATEGORIES.reduce((s,c)=>s+c.rooms.length,0);}
function completedCount(){return Object.keys(ST.completed).length;}
function diplomaCount(){return Object.keys(ST.diplomas).length;}
function computeXP(){return completedCount()*25 + diplomaCount()*50 + (ST.examPassed?500:0);}
function isGrandmaster(){return completedCount()>=totalRooms() && ST.examPassed;}
function catProgress(cat){let done=0;cat.rooms.forEach((r,i)=>{if(ST.completed[roomKey(cat.id,i)])done++;});return done;}

function markRoomComplete(catId,idx){
  const k=roomKey(catId,idx);
  let newDiploma=false;
  if(!ST.completed[k]){
    ST.completed[k]=true;
    toast('<b>+25 XP</b> — room cleared');
  }
  const cat=CATEGORIES.find(c=>c.id===catId);
  if(catProgress(cat)>=cat.rooms.length && !ST.diplomas[catId]){
    ST.diplomas[catId]=true; newDiploma=true;
  }
  ST.xp=computeXP();
  saveState();
  if(newDiploma){ setTimeout(()=>{confettiBurst(); toast('🏅 <b>Diploma earned</b> — '+esc(cat.name));},200); }
}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function animateCount(el, to, dur){
  if(!el) return;
  const from=0; const start=performance.now();
  function step(now){
    const p=Math.min(1,(now-start)/dur);
    const eased=1-Math.pow(1-p,3);
    el.textContent = Math.round(from+(to-from)*eased);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function ring(pct,color,size){
  size=size||76; const r=(size-10)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<div class="statring" style="width:'+size+'px;height:'+size+'px;"><svg width="'+size+'" height="'+size+'">'+

function runBoot(){
  const lines=['INITIALIZING CYBERGRID CONNECTION...','LOADING TRAINING MODULES [9 DOMAINS / 100 ROOMS]...','ESTABLISHING SECURE SESSION...','ACCESS GRANTED.'];
  const el=document.getElementById('bootText');
  if(!el) return;
  let out='';
  let li=0;
  function typeLine(){
    if(li>=lines.length){ el.innerHTML=out; document.getElementById('loginForm').style.display='block'; const inp=document.getElementById('loginInput'); if(inp) inp.focus(); return; }
    const line=lines[li]; let ci=0;
    function typeChar(){
      if(ci<=line.length){
        el.innerHTML = out + line.slice(0,ci) + '<span class="caret"></span>';
        ci++; setTimeout(typeChar, 12);
      } else { out += line + '\n'; li++; setTimeout(typeLine, 120); }
    }
    typeChar();
  }
  typeLine();
}
function doLogin(){
  const v = document.getElementById('loginInput').value.trim();
  if(!v){document.getElementById('loginInput').focus();return;}
  ST.username = v.slice(0,24);
  saveState();
  initDb();
  go('dashboard');
}

      const sel = ST._quizSel[qi]===oi;
      if(showResult){
        if(oi===q.a) cls+=' correct';
        else if(sel && oi!==q.a) cls+=' wrong';

  for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; }

}

function viewLeaderboard(){
  let html=topbar('leaderboard');
  html+='<h2 class="head" style="color:var(--ink);font-size:1.4rem;">Global leaderboard</h2>';
  html+='<div class="small mt">Ranked by XP across everyone training on this grid.'+(dbReady?'':' (local device only — live sync unavailable in this view)')+'</div>';
  html+='<div class="panel mt2">';
  let list = lbCache.slice();
  if(!dbReady || list.length===0){
    list = [{username:ST.username,xp:computeXP(),rooms:completedCount(),diplomas:diplomaCount(),grandmaster:isGrandmaster()}];
  }
  list.sort((a,b)=>(b.xp||0)-(a.xp||0));
  if(list.length===0){
    html+='<div class="small center">No agents ranked yet. Be the first.</div>';
  } else {
    list.forEach((row,i)=>{
      const me = row.username===ST.username;
      const rankColor = i===0?'var(--ylw)':i===1?'var(--ink-dim)':i===2?'var(--amber)':'var(--ink-faint)';
      html+='<div class="lbrow '+(me?'me':'')+'">'+
        '<div class="lbrank" style="color:'+rankColor+';">#'+(i+1)+'</div>'+
        '<div style="flex:1;">'+(row.grandmaster?'👑 ':'')+esc(row.username||'agent')+(me?' <span class="small">(you)</span>':'')+
          '<div class="small">'+(row.rooms||0)+' rooms · '+(row.diplomas||0)+' diplomas'+(row.examPassed?' · exam 100%':'')+'</div></div>'+
        '<div class="head" style="color:var(--grn);">'+(row.xp||0)+' XP</div>'+
      '</div>';
    });
  }
  html+='</div>';
  return html;
}

/* ============ BOOT ============ */
render();
if(ST._screen==='login') setTimeout(runBoot, 250);
if(ST.username){ initDb(); }
</script>
</body>
